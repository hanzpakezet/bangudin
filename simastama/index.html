  <script>

let booksCache = [];
let studentsCache = [];
let borrowsCache = [];
let visitorsCache = [];
let finesCache = [];
let settingsCache = null;
let historyCache = [];

// MENU LOGOUT
function toggleProfileMenu(){
  document
    .getElementById('profile-menu')
    .classList
    .toggle('hidden');
}

function logout() {

    localStorage.removeItem('isLoggedIn');

    // Sembunyikan aplikasi
    document.getElementById(
        'app-container'
    ).style.display = 'none';

    // Tampilkan halaman login
    document.getElementById(
        'login-screen'
    ).style.display = '';

    // Bersihkan form login
    const username =
        document.getElementById('username');

    const password =
        document.getElementById('password');

    if (username) {
        username.value = '';
    }

    if (password) {
        password.value = '';
    }
}
document.addEventListener(
'click',
function(e){
  const menu =
    document.getElementById(
      'profile-menu'
    );
  if(
    !e.target.closest('#profile-menu')
    &&
    !e.target.closest(
      '[onclick="toggleProfileMenu()"]'
    )
  ){
    menu?.classList.add(
      'hidden'
    );
  }
});

// ----------------------------------------- JS CRUD ---------------------------------

// =========================================================
// SUPABASE DATA LAYER
// =========================================================

async function getBooks(forceRefresh = false) {

    if (booksCache.length && !forceRefresh) {
        return booksCache;
    }

    const { data, error } = await supabaseClient
        .from('books')
        .select('*')
        .order('id', { ascending: true });

    if (error) {
        console.error('getBooks:', error);
        toast('Gagal mengambil data buku', 'error');
        return booksCache = [];
    }

    booksCache = (data || []).map(b => ({
        id: b.id,
        title: b.title || '',
        isbn: b.isbn || '',
        author: b.author || '',
        publisher: b.publisher || '',
        year: b.year,
        category: b.category || '',
        rack: b.rack || '',
        stockTotal: Number(b.stock_total || 0),
        stockAvailable: Number(b.stock_available || 0)
    }));

    return booksCache;
}


// =========================================================
// SETTINGS
// =========================================================

async function getSettings(forceRefresh = false) {

    if (settingsCache && !forceRefresh) {
        return settingsCache;
    }

    const { data, error } = await supabaseClient
        .from('settings')
        .select('key,value');

    if (error) {
        console.error('getSettings:', error);

        return settingsCache = {
            libName: 'PERPUSTAKAAN INSIMA',
            schoolName: 'SMA INSIMA',
            address: '',
            phone: '',
            finePerDay: 1000,
            loanDays: 7,
            maxBorrow: 3
        };
    }

    const settings = {};

    (data || []).forEach(row => {
        settings[row.key] = row.value;
    });

    settingsCache = {
        libName: settings.NamaPerpustakaan || '',
        schoolName: settings.NamaSekolah || '',
        address: settings.Alamat || '',
        phone: settings.Telepon || '',
        finePerDay: Number(settings.DendaPerHari || 1000),
        loanDays: Number(settings.LamaPinjam || 7),
        maxBorrow: Number(settings.MaksPinjam || 3)
    };

    return settingsCache;
}


// =========================================================
// STUDENTS / MEMBERS
// =========================================================

async function getStudents(forceRefresh = false) {

    if (studentsCache.length && !forceRefresh) {
        return studentsCache;
    }

    const { data, error } = await supabaseClient
        .from('students')
        .select('*')
        .order('name', { ascending: true });

    if (error) {
        console.error('getStudents:', error);
        toast('Gagal mengambil data member', 'error');
        return studentsCache = [];
    }

    studentsCache = (data || []).map(s => ({
        nis: s.nis,
        name: s.name || '',
        class: s.class || '',
        gender: s.gender || '',
        active: s.active === true
    }));

    return studentsCache;
}


// =========================================================
// BORROWINGS
// =========================================================

async function getBorrows(forceRefresh = false) {

    if (!settingsCache) {
        settingsCache = await getSettings(true);
    }

    if (borrowsCache.length && !forceRefresh) {
        return borrowsCache;
    }

    const { data, error } = await supabaseClient
        .from('borrowings')
        .select(`
            transaction_id,
            book_id,
            student_nis,
            borrow_date,
            due_date,
            return_date,
            status,
            books (
                title
            ),
            students (
                name
            )
        `)
        .order('borrow_date', { ascending: false });

    if (error) {
        console.error('getBorrows:', error);
        toast('Gagal mengambil data peminjaman', 'error');
        return borrowsCache = [];
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    borrowsCache = (data || []).map(b => {

        const due = new Date(b.due_date);
        due.setHours(0, 0, 0, 0);

        const lateDays = Math.max(
            0,
            Math.floor(
                (today - due) / 86400000
            )
        );

        let status = b.status;

        if (
            status !== 'Selesai' &&
            lateDays > 0
        ) {
            status = 'Terlambat';
        }

        return {
            transactionId: b.transaction_id,
            bookId: b.book_id,
            nis: b.student_nis,

            studentName:
                b.students?.name || '',

            bookTitle:
                b.books?.title || '',

            borrowDate: b.borrow_date,
            dueDate: b.due_date,
            returnDate: b.return_date,

            status,

            lateDays,

            fine:
                lateDays *
                Number(settingsCache.finePerDay || 0)
        };
    });

    return borrowsCache;
}


// =========================================================
// VISITORS
// =========================================================

async function getVisitors(forceRefresh = false) {

    if (visitorsCache.length && !forceRefresh) {
        return visitorsCache;
    }

    const { data, error } = await supabaseClient
        .from('visitors')
        .select('*')
        .order('visit_date', {
            ascending: false
        })
        .order('time_in', {
            ascending: false
        });

    if (error) {
        console.error('getVisitors:', error);
        toast('Gagal mengambil data pengunjung', 'error');
        return visitorsCache = [];
    }

    visitorsCache = (data || []).map(v => ({
        id: v.id,
        date: v.visit_date,
        nis: v.student_nis,
        name: v.name || '',
        class: v.class || '',
        time: v.time_in || '',
        purpose: v.purpose || ''
    }));

    return visitorsCache;
}


// =========================================================
// HISTORY
// =========================================================

async function getHistory(forceRefresh = false) {

    if (historyCache.length && !forceRefresh) {
        return historyCache;
    }

    const { data, error } = await supabaseClient
        .from('history')
        .select('*')
        .order('return_date', {
            ascending: false
        });

    if (error) {
        console.error('getHistory:', error);
        toast('Gagal mengambil riwayat', 'error');
        return historyCache = [];
    }

    historyCache = (data || []).map(h => ({
        studentName: h.student_name || '',
        bookId: h.book_id || '',
        bookTitle: h.book_title || '',
        borrowDate: h.borrow_date,
        returnDate: h.return_date,
        fine: Number(h.fine || 0),
        transactionId: h.transaction_id || ''
    }));

    return historyCache;
}


// =========================================================
// FINES
// =========================================================

async function getFines(forceRefresh = false) {

    if (finesCache.length && !forceRefresh) {
        return finesCache;
    }

    const { data, error } = await supabaseClient
        .from('fines')
        .select('*')
        .order('created_at', {
            ascending: false
        });

    if (error) {
        console.error('getFines:', error);
        toast('Gagal mengambil data denda', 'error');
        return finesCache = [];
    }

    finesCache = (data || []).map(f => ({
        transactionId: f.transaction_id,
        nis: f.student_nis,
        studentName: f.student_name || '',
        class: f.class || '',
        bookTitle: f.book_title || '',
        fine: Number(f.fine || 0),
        status: f.status,
        paidAt: f.paid_at
    }));

    return finesCache;
}

function getToday() {
    const today = new Date();

    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const day = String(today.getDate()).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

async function refreshCache(){
    booksCache = await getBooks(true);
    studentsCache = await getStudents(true);
    borrowsCache = await getBorrows(true);
    visitorsCache = await getVisitors(true);
    settingsCache = await getSettings(true);
    finesCache = await getFines(true);
    historyCache = await getHistory(true);

    console.log("CACHE");
    console.log("Books :", booksCache.length);
    console.log("Students :", studentsCache.length);
    console.log("Borrows :", borrowsCache.length);
    console.log("Visitors :", visitorsCache.length);
}

async function preloadEssentialData(){
    await getSettings(true);
    await Promise.all([
        getBooks(true),
        getStudents(true),
        getBorrows(true),
        getVisitors(true)
    ]);
}

// ====-----------------------------------------= UI UTILS ---------------------------------------------=====
function toast(msg,type='success'){
  const colors={success:'bg-emerald-600',error:'bg-red-600',warning:'bg-amber-600',info:'bg-primary-600'};
  const el=document.createElement('div');el.className=`toast ${colors[type]} text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium`;el.textContent=msg;document.getElementById('toast-container').appendChild(el);setTimeout(()=>el.remove(),3000);
}

let booksPage=1,
    booksSearch='',
    booksCategory='',
    booksRack='',
    booksSort='',
    booksSortDirection='asc',
    booksPerPage=25;
async function renderBooks(){
  let books = booksCache;
  if(booksSearch)
    books=books.filter(b=>
        b.title.toLowerCase().includes(booksSearch)||
        b.id.toLowerCase().includes(booksSearch)||
        b.isbn.includes(booksSearch)
    );
  if(booksCategory)books=books.filter(b=>b.category===booksCategory);
  if(booksRack)books=books.filter(b=>b.rack===booksRack);

  if(booksSort){

    books.sort((a,b)=>{

        let valueA;
        let valueB;

        switch(booksSort){

            case 'id':
                valueA = a.id || '';
                valueB = b.id || '';
                break;

            case 'title':
                valueA = a.title || '';
                valueB = b.title || '';
                break;

            case 'author':
                valueA = a.author || '';
                valueB = b.author || '';
                break;

            case 'isbn':
                valueA = a.isbn || '';
                valueB = b.isbn || '';
                break;

            case 'stock':
                valueA = Number(a.stockTotal || 0);
                valueB = Number(b.stockTotal || 0);
                break;

            default:
                return 0;
        }

        if(booksSort === 'stock'){

            return booksSortDirection === 'asc'
                ? valueA - valueB
                : valueB - valueA;

        }

        return booksSortDirection === 'asc'
            ? String(valueA).localeCompare(
                String(valueB),
                'id',
                {numeric:true}
            )
            : String(valueB).localeCompare(
                String(valueA),
                'id',
                {numeric:true}
            );

    });

async function saveBook(e, id) {
    e.preventDefault();

    const btn = e.target.querySelector(
        'button[type="submit"]'
    );

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    showLoader();

    try {
        const f = new FormData(e.target);

        const title = f.get('title')?.trim();
        const isbn = f.get('isbn')?.trim() || '';
        const author = f.get('author')?.trim() || '';
        const publisher = f.get('publisher')?.trim() || '';
        const yearValue = f.get('year');
        const category = f.get('category');
        const rack = f.get('rack')?.trim() || '';
        const newStockTotal = Number(f.get('stockTotal') || 0);

        if (!title) {
            throw new Error('Judul buku wajib diisi');
        }

        if (!category) {
            throw new Error('Kategori buku wajib dipilih');
        }

        if (newStockTotal < 0) {
            throw new Error('Stok tidak boleh negatif');
        }


        // =====================================================
        // EDIT BUKU
        // =====================================================

        if (id) {

            const books = await getBooks();

            const oldBook = books.find(
                b => b.id === id
            );

            if (!oldBook) {
                throw new Error(
                    'Data buku tidak ditemukan'
                );
            }

            // Jumlah buku yang sedang dipinjam
            const borrowed =
                oldBook.stockTotal -
                oldBook.stockAvailable;

            // Tidak boleh mengurangi total stok
            // di bawah jumlah yang sedang dipinjam
            if (newStockTotal < borrowed) {

                throw new Error(
                    `Stok tidak boleh kurang dari ${borrowed} buku karena masih dipinjam`
                );
            }

            const newStockAvailable =
                newStockTotal - borrowed;


            const { error } = await supabaseClient
                .from('books')
                .update({
                    title: title,
                    isbn: isbn,
                    author: author,
                    publisher: publisher,
                    year: yearValue
                        ? Number(yearValue)
                        : null,
                    category: category,
                    rack: rack,
                    stock_total: newStockTotal,
                    stock_available: newStockAvailable
                })
                .eq('id', id);


            if (error) {
                console.error(
                    'Supabase update book:',
                    error
                );

                throw new Error(
                    error.message ||
                    'Gagal memperbarui buku'
                );
            }


            toast(
                'Buku berhasil diperbarui'
            );

        }


        // =====================================================
        // TAMBAH BUKU
        // =====================================================

        else {

            const books = await getBooks();

            const categoryCode = {
                'Fiksi': 'FS',
                'Non-Fiksi': 'NF',
                'Sejarah': 'SJ',
                'Sains': 'SN',
                'Matematika': 'MT',
                'Bahasa': 'BH',
                'Agama': 'AG',
                'Teknologi': 'TK',
                'Seni': 'SE',
                'Olahraga': 'OR'
            };


            const code =
                categoryCode[category] || 'BK';


            // Cari ID terbesar pada kategori tersebut
            const sameCategory =
                books.filter(
                    b => b.id?.startsWith(code)
                );


            const lastNumber =
                sameCategory.length
                    ? Math.max(
                        ...sameCategory.map(
                            b => {
                                const number =
                                    Number(
                                        b.id.substring(
                                            code.length
                                        )
                                    );

                                return Number.isFinite(
                                    number
                                )
                                    ? number
                                    : 0;
                            }
                        )
                    )
                    : 0;


            const newId =
                code +
                String(lastNumber + 1)
                    .padStart(4, '0');


            // Cegah ID duplikat
            const existing =
                books.find(
                    b => b.id === newId
                );

            if (existing) {
                throw new Error(
                    `ID buku ${newId} sudah digunakan`
                );
            }


            const { error } =
                await supabaseClient
                    .from('books')
                    .insert({
                        id: newId,
                        title: title,
                        isbn: isbn,
                        author: author,
                        publisher: publisher,
                        year: yearValue
                            ? Number(yearValue)
                            : null,
                        category: category,
                        rack: rack,
                        stock_total: newStockTotal,
                        stock_available: newStockTotal
                    });


            if (error) {
                console.error(
                    'Supabase insert book:',
                    error
                );

                throw new Error(
                    error.message ||
                    'Gagal menambahkan buku'
                );
            }


            toast(
                `Buku ${newId} berhasil ditambahkan`
            );
        }


        // =====================================================
        // REFRESH CACHE + UI
        // =====================================================

        booksCache =
            await getBooks(true);

        closeModal();

        await renderBooks();

        await refreshDashboard();

    }

    catch (err) {

        console.error(
            'saveBook error:',
            err
        );

        toast(
            err.message ||
            'Gagal menyimpan buku',
            'error'
        );

    }

    finally {

        hideLoader();

        btn.disabled = false;
        btn.textContent = 'Simpan';

    }
}

async function confirmDeleteBook(bookId) {

    showLoader();

    try {

        // ==========================================
        // CARI DATA BUKU
        // ==========================================

        const books =
            await getBooks(true);

        const book =
            books.find(
                b => b.id === bookId
            );

        if (!book) {

            toast(
                'Buku tidak ditemukan',
                'error'
            );

            return;
        }


        // ==========================================
        // CEK PEMINJAMAN AKTIF
        // ==========================================

        const {
            data: activeBorrows,
            error: borrowError
        } = await supabaseClient
            .from('borrowings')
            .select('transaction_id')
            .eq('book_id', bookId)
            .neq('status', 'Selesai')
            .limit(1);


        if (borrowError) {

            throw new Error(
                borrowError.message ||
                'Gagal memeriksa peminjaman buku'
            );

        }


        // ==========================================
        // MASIH DIPINJAM
        // JANGAN BUKA POPUP
        // ==========================================

        if (
            activeBorrows &&
            activeBorrows.length > 0
        ) {

            toast(
                'Buku masih sedang dipinjam dan tidak dapat dihapus',
                'error'
            );

            return;
        }


        // ==========================================
        // AMAN
        // BARU TAMPILKAN POPUP
        // ==========================================

        openModal(
            'Hapus Buku',
            `
                <p class="text-sm mb-4">
                    Yakin ingin menghapus buku ini?
                </p>

                <div class="bg-gray-50 dark:bg-slate-800 rounded-lg p-3 mb-4">

                    </div>

                </div>

                <p class="text-xs text-gray-400 mb-4">
                    Buku tidak memiliki peminjaman aktif
                    dan dapat dihapus.
                </p>

                <div class="flex gap-2">

                    <button
                        id="btn-delete-book"
                        onclick="deleteBook('${book.id}')"
                        class="flex-1 py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-sm font-medium"
                    >
                        Hapus
                    </button>

                    <button
                        onclick="closeModal()"
                        class="flex-1 py-2 bg-gray-100 dark:bg-slate-700 rounded-lg text-sm font-medium"
                    >
                        Batal
                    </button>

                </div>
            `
        );

        lucide.createIcons();

    }

    catch (err) {

        console.error(
            'confirmDeleteBook error:',
            err
        );

        toast(
            err.message ||
            'Gagal memeriksa buku',
            'error'
        );

    }

    finally {

        hideLoader();

    }
}

async function deleteBook(bookId) {

    const btn =
        document.getElementById(
            'btn-delete-book'
        );

    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Menghapus...';
    }

    showLoader();

    try {

        // ==========================================
        // CEK LAGI SEBELUM DELETE
        // ==========================================

        const {
            data: activeBorrows,
            error: borrowError
        } = await supabaseClient
            .from('borrowings')
            .select('transaction_id')
            .eq('book_id', bookId)
            .neq('status', 'Selesai')
            .limit(1);


        if (borrowError) {

            throw new Error(
                borrowError.message ||
                'Gagal memeriksa peminjaman buku'
            );

        }


        if (
            activeBorrows &&
            activeBorrows.length > 0
        ) {

            closeModal();

            toast(
                'Buku masih sedang dipinjam dan tidak dapat dihapus',
                'error'
            );

            return;
        }


        // ==========================================
        // DELETE BUKU
        // ==========================================

        const {
            error
        } = await supabaseClient
            .from('books')
            .delete()
            .eq('id', bookId);


        if (error) {

            throw new Error(
                error.message ||
                'Gagal menghapus buku'
            );

        }


        // ==========================================
        // REFRESH CACHE
        // ==========================================

        booksCache =
            await getBooks(true);


        // ==========================================
        // REFRESH UI
        // ==========================================

        closeModal();

        await renderBooks();

        await refreshDashboard();

        toast(
            'Buku berhasil dihapus'
        );

    }

    catch (err) {

        console.error(
            'deleteBook error:',
            err
        );


        if (err.code === '23503') {

            toast(
                'Buku masih terhubung dengan transaksi dan tidak dapat dihapus',
                'error'
            );

        } else {

            toast(
                err.message ||
                'Gagal menghapus buku',
                'error'
            );

        }

    }

    finally {

        hideLoader();

        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Hapus';
        }

    }
}

async function saveStudent(e, nis) {
    e.preventDefault();

    const btn = e.target.querySelector(
        'button[type="submit"]'
    );

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    showLoader();

    try {
        const f = new FormData(e.target);

        const studentNis = f.get('nis')?.trim();
        const name = f.get('name')?.trim();
        const className = f.get('class')?.trim() || '';
        const gender = f.get('gender') || '';

        // ================================================
        // VALIDASI
        // ================================================

        if (!nis && !studentNis) {
            throw new Error('NIS wajib diisi');
        }

        if (!name) {
            throw new Error('Nama siswa wajib diisi');
        }


        // ================================================
        // UPDATE SISWA
        // ================================================

        if (nis) {

            const { error } = await supabaseClient
                .from('students')
                .update({
                    name: name,
                    class: className,
                    gender: gender,
                    active: true
                })
                .eq('nis', nis);

            if (error) {
                console.error(
                    'Supabase update student:',
                    error
                );

                throw new Error(
                    error.message ||
                    'Gagal memperbarui data siswa'
                );
            }

            toast('Member berhasil diperbarui');
        }


        // ================================================
        // TAMBAH SISWA
        // ================================================

        else {

            // Cek apakah NIS sudah ada
            const { data: existing, error: checkError } =
                await supabaseClient
                    .from('students')
                    .select('nis')
                    .eq('nis', studentNis)
                    .maybeSingle();

            if (checkError) {
                console.error(
                    'Supabase check student:',
                    checkError
                );

                throw new Error(
                    checkError.message ||
                    'Gagal memeriksa NIS'
                );
            }

            if (existing) {
                throw new Error(
                    'ID sudah terdaftar'
                );
            }


            // Insert siswa
            const { error } =
                await supabaseClient
                    .from('students')
                    .insert({
                        nis: studentNis,
                        name: name,
                        class: className,
                        gender: gender,
                        active: true
                    });

            if (error) {
                console.error(
                    'Supabase insert student:',
                    error
                );

                throw new Error(
                    error.message ||
                    'Gagal menambahkan siswa'
                );
            }

            toast('Member berhasil ditambahkan');
        }


        // ================================================
        // REFRESH CACHE
        // ================================================

        studentsCache =
            await getStudents(true);


        // ================================================
        // REFRESH UI
        // ================================================

        closeModal();

        await renderStudents();

        await refreshDashboard();

    }

    catch (err) {

        console.error(
            'saveStudent error:',
            err
        );

        toast(
            err.message ||
            'Gagal menyimpan data siswa',
            'error'
        );

    }

    finally {

        hideLoader();

        btn.disabled = false;
        btn.textContent = 'Simpan';
    }
}

async function deleteStudent(nis) {

    const btn =
        document.getElementById(
            'btn-delete-student'
        );

    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Menghapus...';
    }

    showLoader();

    try {

        // ==========================================
        // CEK LAGI SEBELUM DELETE
        // ==========================================

        const {
            data: activeBorrows,
            error: borrowError
        } = await supabaseClient
            .from('borrowings')
            .select('transaction_id')
            .eq('student_nis', nis)
            .neq('status', 'Selesai')
            .limit(1);


        if (borrowError) {
            throw new Error(
                borrowError.message
            );
        }


        if (
            activeBorrows &&
            activeBorrows.length > 0
        ) {

            closeModal();

            toast(
                'Member masih memiliki buku yang sedang dipinjam',
                'error'
            );

            return;
        }


        // ==========================================
        // DELETE
        // ==========================================

        const {
            error
        } = await supabaseClient
            .from('students')
            .delete()
            .eq('nis', nis);


        if (error) {
            throw new Error(
                error.message ||
                'Gagal menghapus member'
            );
        }


        // ==========================================
        // REFRESH
        // ==========================================

        studentsCache =
            await getStudents(true);

        closeModal();

        await renderStudents();

        await refreshDashboard();

        toast(
            'Member berhasil dihapus'
        );

    }

    catch (err) {

        console.error(
            'deleteStudent error:',
            err
        );

        toast(
            err.message ||
            'Gagal menghapus member',
            'error'
        );

    }

    finally {

        hideLoader();

        if (btn) {
            btn.disabled = false;
            btn.textContent = 'Hapus';
        }

    }
}

async function saveBorrow(e) {
    e.preventDefault();

    const btn = e.target.querySelector(
        'button[type="submit"]'
    );

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    showLoader();

    try {
        const f = new FormData(e.target);

        const nis = f.get('nis')?.trim();
        const bookId = f.get('bookId')?.trim();

        const borrowDate =
            f.get('borrowDate') ||
            getToday();

        const dueDate =
            f.get('dueDate') ||
            null;


        // =================================================
        // VALIDASI DASAR
        // =================================================

        if (!nis) {
            throw new Error(
                'Member belum dipilih'
            );
        }

        if (!bookId) {
            throw new Error(
                'Buku belum dipilih'
            );
        }


        // =================================================
        // CEK MEMBER
        // =================================================

        const students =
            await getStudents(true);

        const student =
            students.find(
                s => s.nis === nis
            );

        if (!student) {
            throw new Error(
                'Member tidak ditemukan'
            );
        }


        // =================================================
        // CEK BUKU
        // =================================================

        const books =
            await getBooks(true);

        const book =
            books.find(
                b => b.id === bookId
            );

        if (!book) {
            throw new Error(
                'Buku tidak ditemukan'
            );
        }


        // =================================================
        // PINJAM
        // =================================================
        //
        // Semua proses berikut dilakukan oleh PostgreSQL:
        //
        // - cek member aktif
        // - cek stok
        // - cek batas peminjaman
        // - generate transaction ID
        // - insert borrowing
        // - kurangi stok
        // - catat pengunjung
        //
        // dalam SATU transaksi database.
        // =================================================

        const {
            data,
            error
        } = await supabaseClient.rpc(
            'create_borrowing',
            {
                p_book_id: bookId,
                p_nis: nis,
                p_borrow_date: borrowDate,
                p_due_date: dueDate
            }
        );


        if (error) {

            console.error(
                'create_borrowing error:',
                error
            );

            throw new Error(
                error.message ||
                'Gagal melakukan peminjaman'
            );
        }

async function returnBook(transactionId) {

    const btn =
        document.getElementById(
            `return-${transactionId}`
        );

    if (btn) {
        btn.disabled = true;
        btn.textContent = 'Mengembalikan...';
    }

    showLoader();

    try {

        // =================================================
        // VALIDASI TRANSAKSI
        // =================================================

        const borrows =
            await getBorrows(true);

        const borrow =
            borrows.find(
                b =>
                    b.transactionId ===
                    transactionId
            );

        if (!borrow) {
            throw new Error(
                'Data peminjaman tidak ditemukan'
            );
        }


        // =================================================
        // SATU TRANSAKSI DATABASE
        // =================================================
        //
        // PostgreSQL akan:
        //
        // 1. Mengunci transaksi
        // 2. Mengambil buku
        // 3. Mengambil member
        // 4. Menghitung keterlambatan
        // 5. Menghitung denda
        // 6. Mengubah status → Selesai
        // 7. Menambah stok
        // 8. Membuat riwayat
        // 9. Membuat denda jika terlambat
        // 10. Mencatat pengunjung
        //
        // Semuanya dalam SATU transaksi.
        // =================================================

        const {
            data,
            error
        } = await supabaseClient.rpc(
            'return_borrowing',
            {
                p_transaction_id:
                    transactionId
            }
        );


        if (error) {

            console.error(
                'return_borrowing error:',
                error
            );

            throw new Error(
                error.message ||
                'Gagal mengembalikan buku'
            );
        }


        // =================================================
        // HASIL
        // =================================================

        console.log(
            'Pengembalian berhasil:',
            data
        );


        // =================================================
        // REFRESH CACHE
        // =================================================

        booksCache =
            await getBooks(true);

        borrowsCache =
            await getBorrows(true);

        historyCache =
            await getHistory(true);

        finesCache =
            await getFines(true);

        visitorsCache =
            await getVisitors(true);


        // =================================================
        // REFRESH UI
        // =================================================

        closeModal();

        await renderReturn();

        await renderBorrow();

        await renderVisitors();

        await renderFines();

        await renderBooks();

        await refreshDashboard();


        // =================================================
        // NOTIFIKASI
        // =================================================

        const lateDays =
            Number(data?.late_days || 0);

        const fine =
            Number(data?.fine || 0);

        toast(
            lateDays > 0
                ? `Buku dikembalikan. Denda ${formatCurrency(fine)}`
                : 'Buku berhasil dikembalikan'
        );

    }

    catch (err) {

        console.error(
            'returnBook error:',
            err
        );

        toast(
            err.message ||
            'Gagal mengembalikan buku',
            'error'
        );

    }

    finally {

        hideLoader();

        if (btn) {
            btn.disabled = false;
            btn.textContent =
                'Kembalikan';
        }

    }
}

let historyFilter='all';
let historyPage = 1;
let historyPageSize = 25;
let historySortBy = 'latest';
let historySortDirection = 'asc';

function getProcessedHistory() {

    let history = [
        ...(historyCache || [])
    ];

    const today = new Date(getToday());
    today.setHours(0, 0, 0, 0);


    // ================================================
    // FILTER WAKTU
    // ================================================

    if (historyFilter === 'today') {

        history = history.filter(
            h => h.returnDate === getToday()
        );

    }

    else if (historyFilter === 'week') {

        const w = new Date(today);

        w.setDate(
            w.getDate() - 7
        );

        history = history.filter(h => {

            if (!h.returnDate) {
                return false;
            }

            return new Date(h.returnDate) >= w;
        });

    }

    else if (historyFilter === 'month') {

        history = history.filter(
            h =>
                h.returnDate &&
                h.returnDate.startsWith(
                    getToday().slice(0, 7)
                )
        );

    }


    // ================================================
    // SORTING
    // ================================================

    history.sort((a, b) => {

        // --------------------------------------------
        // TERBARU / TERLAMA
        // --------------------------------------------

        if (
            historySortBy === 'latest' ||
            historySortBy === 'oldest'
        ) {

            const dateA =
                new Date(
                    a.returnDate ||
                    a.borrowDate ||
                    '1970-01-01'
                );

            const dateB =
                new Date(
                    b.returnDate ||
                    b.borrowDate ||
                    '1970-01-01'
                );

            return historySortBy === 'latest'
                ? dateB - dateA
                : dateA - dateB;
        }


        // --------------------------------------------
        // NAMA MEMBER / NAMA BUKU
        // --------------------------------------------

        let valueA = '';
        let valueB = '';

        if (
            historySortBy === 'name'
        ) {

            valueA =
                a.studentName || '';

            valueB =
                b.studentName || '';

        }

        else if (
            historySortBy === 'book'
        ) {

            valueA =
                a.bookTitle || '';

            valueB =
                b.bookTitle || '';

        }


        const result =
            String(valueA).localeCompare(
                String(valueB),
                'id',
                {
                    numeric: true,
                    sensitivity: 'base'
                }
            );


        return historySortDirection === 'asc'
            ? result
            : -result;

    });


    return history;
}

    if (page < 1) {

    if (page > totalPages) {

let visitorsPage = 1;

function getProcessedVisitors() {

    let visitors = [
        ...(visitorsCache || [])
    ];


    // ================================================
    // FILTER TUJUAN
    // ================================================

    if (
        visitorsPurposeFilter !== 'all'
    ) {

        visitors = visitors.filter(
            v =>
                (v.purpose || '') ===
                visitorsPurposeFilter
        );

    }


    // ================================================
    // SORTING
    // ================================================

    visitors.sort((a, b) => {

        // --------------------------------------------
        // TERBARU / TERLAMA

        if (
            visitorsSortBy === 'latest' ||
            visitorsSortBy === 'oldest'
        ) {

            const dateA = new Date(
                `${a.date || '1970-01-01'}T${a.time || '00:00:00'}`
            );

            const dateB = new Date(
                `${b.date || '1970-01-01'}T${b.time || '00:00:00'}`
            );

            return visitorsSortBy === 'latest'
                ? dateB - dateA
                : dateA - dateB;
        }


        // --------------------------------------------
        // NAMA MEMBER / ID MEMBER
        // --------------------------------------------

        let valueA = '';
        let valueB = '';


        if (
            visitorsSortBy === 'name'
        ) {

            valueA = a.name || '';

        else if (

        ) {

            valueA = a.nis || '';
            valueB = b.nis || '';

        // --------------------------------------------

        const result =
            String(valueA).localeCompare(
                String(valueB),
                'id',
                {
                    numeric: true,
                    sensitivity: 'base'
                }
            );


        return visitorsSortDirection === 'asc'
            ? result
            : -result;

    });


    return visitors;
}

function changeVisitorsPage(page) {

    const visitors =
        getProcessedVisitors();

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                visitors.length /
                visitorsPageSize
            )
        );

    if (page < 1) {
        page = 1;
    }

    if (page > totalPages) {
        page = totalPages;
    }

    visitorsPage = page;

    renderVisitors();
}

async function saveVisitor(e) {

    e.preventDefault();

    const btn =
        e.target.querySelector(
            'button[type="submit"]'
        );

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    showLoader();

    try {

        const f = new FormData(e.target);

        // ============================================
        // CARI MEMBER
        // ============================================

        const students =
            await getStudents();

        const student =
            students.find(
                s => s.nis === f.get('nis')
            );

        if (!student) {

            toast(
                'Member tidak ditemukan',
                'error'
            );

            return;
        }


        // ============================================
        // WAKTU KUNJUNGAN
        // ============================================

        const now = new Date();

        const currentTime =
            String(now.getHours()).padStart(2, '0')
            + ':' +
            String(now.getMinutes()).padStart(2, '0')
            + ':' +
            String(now.getSeconds()).padStart(2, '0');


        // ============================================
        // SIMPAN KE SUPABASE
        // ============================================

        const {
            error
        } = await supabaseClient
            .from('visitors')
            .insert({
                visit_date: getToday(),
                student_nis: student.nis,
                name: student.name,
                class: student.class,
                time_in: currentTime,
                purpose: f.get('purpose')
            });


        if (error) {

            console.error(
                'saveVisitor:',
                error
            );

            throw new Error(
                error.message ||
                'Gagal menyimpan pengunjung'
            );
        }


        // ============================================
        // REFRESH CACHE
        // ============================================

        visitorsCache =
            await getVisitors(true);


        // ============================================
        // REFRESH TAMPILAN
        // ============================================

        closeModal();

        await renderVisitors();

        await refreshDashboard();


        toast(
            'Pengunjung berhasil ditambahkan'
        );

    }

    catch (err) {

        console.error(
            'saveVisitor error:',
            err
        );

        toast(
            err.message ||
            'Gagal menyimpan pengunjung',
            'error'
        );

    }

    finally {

        hideLoader();

        btn.disabled = false;
        btn.textContent = 'Simpan';

    }
}

async function renderFines(){
  const fines = await getFines();
    const borrows = await getBorrows();
    const settings = await getSettings();

    const today = new Date();
    today.setHours(0,0,0,0);

    const activeLate = borrows
    .filter(b => b.status !== 'Selesai')
    .map(b => {

        const due = new Date(b.dueDate);
        due.setHours(0,0,0,0);

        const lateDays = Math.floor(
        (today - due) / 86400000
        );

        if(lateDays <= 0) return null;

        return {
        transactionId: b.transactionId,
        nis: b.nis,
        studentName: b.studentName,
        bookTitle: b.bookTitle,
        fine: lateDays * settings.finePerDay,
        status: 'Terlambat'
        };
    })
    .filter(Boolean);

    const unpaid = fines.filter(
    f => f.status === 'Belum Dibayar'
    );

    const paid = fines.filter(
    f => f.status === 'Sudah Dibayar'
    );

    const allActiveFines = [
    ...activeLate,
    ...unpaid
    ];

    const totalUnpaid =

let paymentProcessing = false;

async function payFine(transactionId) {

    if (paymentProcessing) return;

    paymentProcessing = true;

    const btn = document.getElementById(
        `pay-${transactionId}`
    );

    if (btn) {
        btn.disabled = true;
        btn.textContent = "Memproses...";
    }

    toast(
        "Memproses pembayaran...",
        "info"
    );

    showLoader();

    try {

        // ================================================
        // UPDATE STATUS DENDA
        // ================================================

        const { error } = await supabaseClient
            .from('fines')
            .update({
                status: 'Sudah Dibayar',
                paid_at: new Date().toISOString()
            })
            .eq('transaction_id', transactionId)
            .eq('status', 'Belum Dibayar');

        if (error) {

            console.error(
                'Supabase payFine:',
                error
            );

            throw new Error(
                error.message ||
                'Gagal memproses pembayaran'
            );
        }


        // ================================================
        // REFRESH DATA
        // ================================================

        finesCache =
            await getFines(true);


        // ================================================
        // REFRESH UI
        // ================================================

        await renderFines();

        await refreshDashboard();


        toast(
            "Denda berhasil dibayar"
        );

    }

    catch (err) {

        console.error(
            'payFine error:',
            err
        );

        toast(
            err.message ||
            "Pembayaran gagal",
            "error"
        );

    }

    finally {

        hideLoader();

        paymentProcessing = false;

        if (btn) {
            btn.disabled = false;
            btn.textContent = "Bayar";
        }

    }
}

async function saveLibSettings(e) {

    e.preventDefault();

    const btn =
        e.target.querySelector(
            'button[type="submit"]'
        );

    btn.disabled = true;
    btn.textContent = 'Menyimpan...';

    showLoader();

    try {

        const f = new FormData(e.target);

        const settingsToSave = [
            {
                key: 'NamaPerpustakaan',
                value: f.get('libName')?.trim() || ''
            },
            {
                key: 'NamaSekolah',
                value: f.get('schoolName')?.trim() || ''
            },
            {
                key: 'Alamat',
                value: f.get('address')?.trim() || ''
            },
            {
                key: 'Telepon',
                value: f.get('phone')?.trim() || ''
            }
        ];

        const {
            error
        } = await supabaseClient
            .from('settings')
            .upsert(
                settingsToSave,
                {
                    onConflict: 'key'
                }
            );

        if (error) {
            console.error(
                'saveLibSettings:',
                error
            );

            throw new Error(
                error.message ||
                'Gagal menyimpan identitas perpustakaan'
            );
        }

        // Refresh cache
        settingsCache =
            await getSettings(true);

        // Refresh tampilan
        await renderSidebar();
        await renderDashboard();
        await renderSettings();
        updateLandingLibraryName();

        toast(
            'Identitas berhasil disimpan'
        );

    }

    catch (err) {

        console.error(
            'saveLibSettings error:',
            err
        );

        toast(
            err.message ||
            'Gagal menyimpan identitas',
            'error'
        );

    }

    finally {

        hideLoader();

        btn.disabled = false;
        btn.textContent =
            'Simpan Identitas';

    }
}

async function saveLoanSettings(e) {

async function exportData() {

    showLoader();

    try {

        const [
            booksRes,
            studentsRes,
            borrowingsRes,
            visitorsRes,
            historyRes,
            finesRes,
            settingsRes
        ] = await Promise.all([

            supabaseClient
                .from('books')
                .select('*'),

            supabaseClient
                .from('students')
                .select('*'),

            supabaseClient
                .from('borrowings')
                .select('*'),

            supabaseClient
                .from('visitors')
                .select('*'),

            supabaseClient
                .from('history')
                .select('*'),

            supabaseClient
                .from('fines')
                .select('*'),

            supabaseClient
                .from('settings')
                .select('*')

        ]);


        // ==============================================
        // CEK ERROR
        // ==============================================

        const results = [
            booksRes,
            studentsRes,
            borrowingsRes,
            visitorsRes,
            historyRes,
            finesRes,
            settingsRes
        ];

        const error =
            results.find(r => r.error)?.error;

        if (error) {
            throw new Error(error.message);
        }


        // ==============================================
        // DATA JSON SEMENTARA
        // ==============================================

        const data = {

            Buku:
                booksRes.data || [],

            Siswa:
                studentsRes.data || [],

            Peminjaman:
                borrowingsRes.data || [],

            Pengunjung:
                visitorsRes.data || [],

            Riwayat:
                historyRes.data || [],

            Denda:
                finesRes.data || [],

            Pengaturan:
                settingsRes.data || []

        };


        // ==============================================
        // BUAT WORKBOOK
        // ==============================================

        const workbook =
            XLSX.utils.book_new();


        // ==============================================
        // MASUKKAN SETIAP TABEL KE SHEET
        // ==============================================

        Object.entries(data).forEach(
            ([sheetName, rows]) => {

                const worksheet =
                    rows.length
                        ? XLSX.utils.json_to_sheet(rows)
                        : XLSX.utils.aoa_to_sheet([[]]);

                XLSX.utils.book_append_sheet(
                    workbook,
                    worksheet,
                    sheetName
                );

            }
        );


        // ==============================================
        // DOWNLOAD EXCEL
        // ==============================================

        XLSX.writeFile(
            workbook,
            `backup-perpustakaan-${getToday()}.xlsx`
        );


        toast(
            'Database berhasil diexport ke Excel'
        );

    }

    catch (err) {

        console.error(
            'Export Excel error:',
            err
        );

        toast(
            'Export gagal: ' + err.message,
            'error'
        );

    }

    finally {

        hideLoader();

    }
}

async function importExcel(input) {

    const file = input.files[0];

    if (!file) {
        return;
    }


    // Reset input agar file yang sama bisa dipilih lagi
    input.value = '';


    // ==============================================
    // KONFIRMASI
    // ==============================================

    const confirmed = confirm(
        'Import database dari file Excel ini?\n\n' +
        'Data akan dimasukkan ke database Supabase.\n\n' +
        'Pastikan file berasal dari backup aplikasi ini.'
    );

    if (!confirmed) {
        return;
    }


    showLoader();


    try {

        // ==========================================
        // BACA FILE EXCEL
        // ==========================================

        const buffer =
            await file.arrayBuffer();

        const workbook =
            XLSX.read(
                buffer,
                {
                    type: 'array'
                }
            );


        // ==========================================
        // KONVERSI EXCEL → JSON
        // ==========================================

        const data = {};


        const sheetMap = {

            Buku: 'Buku',

            Siswa: 'Siswa',

            Peminjaman: 'Peminjaman',

            Pengunjung: 'Pengunjung',

            Riwayat: 'Riwayat',

            Denda: 'Denda',

            Pengaturan: 'Pengaturan'

        };


        Object.entries(sheetMap).forEach(
            ([sheetName, key]) => {

                const worksheet =
                    workbook.Sheets[sheetName];

                if (!worksheet) {

                    data[key] = [];

                    return;

                }


                data[key] =
                    XLSX.utils.sheet_to_json(
                        worksheet,
                        {
                            defval: null
                        }
                    );

            }
        );


        // ==========================================
        // CEK APAKAH FILE VALID
        // ==========================================

        const totalRows =
            Object.values(data)
                .reduce(
                    (total, rows) =>
                        total + rows.length,
                    0
                );


        if (totalRows === 0) {

            throw new Error(
                'File Excel tidak memiliki data.'
            );

        }


        // ==========================================
        // IMPORT KE SUPABASE
        // ==========================================

        // 1. Buku
        if (data.Buku.length) {

            const { error } =
                await supabaseClient
                    .from('books')
                    .upsert(
                        data.Buku
                    );

            if (error) {
                throw new Error(
                    'Import Buku: ' +
                    error.message
                );
            }
        }


        // 2. Member
        if (data.Siswa.length) {

            const { error } =
                await supabaseClient
                    .from('students')
                    .upsert(
                        data.Siswa
                    );

            if (error) {
                throw new Error(
                    'Import Member: ' +
                    error.message
                );
            }
        }


        // 3. Peminjaman
        if (data.Peminjaman.length) {

            const { error } =
                await supabaseClient
                    .from('borrowings')
                    .upsert(
                        data.Peminjaman
                    );

            if (error) {
                throw new Error(
                    'Import Peminjaman: ' +
                    error.message
                );
            }
        }


        // 4. Pengunjung
        if (data.Pengunjung.length) {

            const { error } =
                await supabaseClient
                    .from('visitors')
                    .upsert(
                        data.Pengunjung
                    );

            if (error) {
                throw new Error(
                    'Import Pengunjung: ' +
                    error.message
                );
            }
        }


        // 5. Riwayat
        if (data.Riwayat.length) {

            const { error } =
                await supabaseClient
                    .from('history')
                    .upsert(
                        data.Riwayat
                    );

            if (error) {
                throw new Error(
                    'Import Riwayat: ' +
                    error.message
                );
            }
        }


        // 6. Denda
        if (data.Denda.length) {

            const { error } =
                await supabaseClient
                    .from('fines')
                    .upsert(
                        data.Denda
                    );

            if (error) {
                throw new Error(
                    'Import Denda: ' +
                    error.message
                );
            }
        }


        // 7. Pengaturan
        if (data.Pengaturan.length) {

            const { error } =
                await supabaseClient
                    .from('settings')
                    .upsert(
                        data.Pengaturan,
                        {
                            onConflict: 'key'
                        }
                    );

            if (error) {
                throw new Error(
                    'Import Pengaturan: ' +
                    error.message
                );
            }
        }


        // ==========================================
        // REFRESH CACHE
        // ==========================================

        booksCache =
            await getBooks(true);

        studentsCache =
            await getStudents(true);

        borrowsCache =
            await getBorrows(true);

        visitorsCache =
            await getVisitors(true);

        historyCache =
            await getHistory(true);

        finesCache =
            await getFines(true);


        // ==========================================
        // REFRESH TAMPILAN
        // ==========================================

        await renderSidebar();

        await renderPage(
            currentPage
        );


        await refreshDashboard();


        toast(
            'Database berhasil diimport dari Excel'
        );

    }

    catch (err) {

        console.error(
            'Import Excel error:',
            err
        );

        toast(
            'Import gagal: ' +
            err.message,
            'error'
        );

    }

    finally {

        hideLoader();

    }

}

function changePassword(e) {

    e.preventDefault();

    const form =
        e.target;

    const currentPassword =
        form.currentPassword.value;

    const newPassword =
        form.newPassword.value;

    const confirmPassword =
        form.confirmPassword.value;


    // ==========================================
    // PASSWORD SAAT INI
    // ==========================================

    const savedPassword =
        localStorage.getItem('app_password') ||
        'admin123';


    if (currentPassword !== savedPassword) {

        toast(
            'Password saat ini salah',
            'error'
        );

        return;
    }


    // ==========================================
    // VALIDASI PASSWORD BARU
    // ==========================================

    if (newPassword.length < 6) {

        toast(
            'Password baru minimal 6 karakter',
            'error'
        );

        return;
    }


    // ==========================================
    // KONFIRMASI
    // ==========================================

    if (newPassword !== confirmPassword) {

        toast(
            'Konfirmasi password tidak cocok',
            'error'
        );

        return;
    }


    // ==========================================
    // JANGAN BOLEH SAMA
    // ==========================================

    if (newPassword === currentPassword) {

        toast(
            'Password baru harus berbeda dari password lama',
            'error'
        );

        return;
    }


    // ==========================================
    // SIMPAN PASSWORD BARU
    // ==========================================

    localStorage.setItem(
        'app_password',
        newPassword
    );


    // ==========================================
    // TUTUP MODAL
    // ==========================================

    closeModal();


    toast(
        'Password berhasil diubah'
    );
}

      books.map(b=>`

          class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-slate-700"
          onclick="navigateTo('books');searchResults.classList.add('hidden');searchInput.value=''">
          ${b.title}
          <span class="text-xs text-gray-400">${b.id}</span>
        </button>
      `).join('');
  }

  if(students.length){
    html +=
      `<div class="p-2 text-[10px] text-gray-400 uppercase font-semibold">
        Member
      </div>`
      +
      students.map(s=>`
        <button
          class="w-full text-left px-3 py-2 text-sm hover:bg-gray-50 dark:hover:bg-slate-700"
          onclick="navigateTo('students');searchResults.classList.add('hidden');searchInput.value=''">
          ${s.name}
          <span class="text-xs text-gray-400">${s.nis}</span>
        </button>
      `).join('');
  }

  if(!html){
    html =
      '<p class="p-3 text-sm text-gray-400">Tidak ditemukan</p>';
  }

  searchResults.innerHTML = html;
  searchResults.classList.remove('hidden');

});
